[package]
name = "ms-delta"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/CaddyGlow/ms-delta"
keywords = ["windows", "delta", "patch", "pa30", "pa19"]
categories = ["compression", "command-line-utilities"]
description = "Bounded native Rust PA19, PA30, PA31 and MS-PATCH LZX Delta file patches"
readme = "README.md"

[features]
default = []
cli = ["dep:clap", "dep:tempfile", "dep:serde_json"]

[dependencies]
hexspell = { package = "caddy-hexspell", version = "1.1", default-features = false }
ms-compress = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
clap = { version = "4.5", features = ["derive"], optional = true }
tempfile = { version = "3.23", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3.23"
serde_json = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Preserve established chunk iteration when building with Rust 1.99.
chunks_exact_to_as_chunks = "allow"

[[bin]]
name = "ms-delta"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
resolver = "3"

[profile.release]
lto = "thin"
strip = true
