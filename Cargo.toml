[package]
name = "ms-delta"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/CaddyGlow/ms-delta"
keywords = ["windows", "delta", "patch", "pa30", "pa19"]
categories = ["compression", "command-line-utilities"]
description = "Bounded native Rust PA19, PA30, PA31 and MS-PATCH LZX Delta file patches"
readme = "README.md"

[features]
default = ["all-formats", "serde"]
all-formats = ["lzxd", "pa19", "pa30", "pa31"]
lzxd = ["dep:ms-compress", "ms-compress/lzx"]
pa19 = ["lzxd", "dep:hexspell"]
pa30 = ["dep:ms-compress", "ms-compress/lzms", "ms-compress/xpress", "dep:hexspell", "dep:sha2", "dep:sha1", "dep:md-5", "dep:iced-x86"]
pa31 = ["pa30"] # PA31 wraps the PA30 engine with extended headers and source integrity.
serde = ["dep:serde"] # Serialize inspection metadata; independent of format selection.
cli = ["all-formats", "serde", "dep:clap", "dep:tempfile", "dep:serde_json"]

[dependencies]
hexspell = { package = "caddy-hexspell", version = "1.1", default-features = false, optional = true }
ms-compress = { version = "0.2", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
tempfile = { version = "3.23", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.23"
serde_json = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Preserve established chunk iteration when building with Rust 1.99.
chunks_exact_to_as_chunks = "allow"

[[bin]]
name = "ms-delta"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
resolver = "3"

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "create_lzxd_fixtures"
required-features = ["lzxd"]

[[example]]
name = "pe_inspect"
required-features = ["pa19"]
