name: ms-delta CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-features --locked
      - run: cargo test --no-default-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "serde", "lzxd", "pa19", "pa30", "pa31", "all-formats", "pa19,serde", "pa30,serde", "pa31,serde", "cli"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --features "${{ matrix.features }}" --locked
      - run: cargo clippy --all-targets --no-default-features --features "${{ matrix.features }}" --locked -- -D warnings
